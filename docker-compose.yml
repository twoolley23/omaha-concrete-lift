# For LOCAL testing only. Coolify deploys directly from the Dockerfile and
# does not use this file -- configure its persistent volume mount in the
# Coolify UI instead (see README.md).
version: "3.9"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LEADS_DB_PATH=/app/data/leads.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
