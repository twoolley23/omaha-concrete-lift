      <line x1="120" y1="30" x2="140" y2="55" stroke="#4A555E" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="170" y1="28" x2="185" y2="45" stroke="#4A555E" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M30 65 Q110 80 190 65" stroke="#B71C1C" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.7"/>
    <text x="110" y="78" text-anchor="middle" fill="#B71C1C" font-size="8" font-family="sans-serif" font-weight="bold" opacity="0.7">VOID</text>
    <g opacity="0.6">
