      <path d="M25 55 Q45 48 65 55" stroke="#FFA726" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M80 55 Q100 48 120 55" stroke="#FFA726" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M135 55 Q155 48 175 55" stroke="#FFA726" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g opacity="0.7">
