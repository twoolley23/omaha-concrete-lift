  <g transform="translate(370, 305)">
    <rect x="0" y="0" width="95" height="22" rx="4" fill="#FFF3E0" opacity="0.9" stroke="#FF9800" stroke-width="1"/>
    <circle cx="14" cy="11" r="6" fill="#FF9800"/>
    <text x="28" y="14" fill="#E65100" font-size="8" font-family="sans-serif" font-weight="bold">Polyurethane Foam</text>
