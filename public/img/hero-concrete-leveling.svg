<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-label="Isometric illustration showing a before/after concrete leveling comparison: a sunken, cracked driveway slab on the left being leveled by polyurethane foam injection on the right, with an Omaha home context">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="60%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#C9E5F5"/>
    </linearGradient>
    <linearGradient id="sunkenSlab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0B8C3"/>
      <stop offset="100%" stop-color="#8A94A2"/>
    </linearGradient>
    <linearGradient id="leveledSlab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D5DBE0"/>
      <stop offset="100%" stop-color="#A8B2BF"/>
    </linearGradient>
    <radialGradient id="foamGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF9800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1B2733" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#skyGrad)"/>
  <g opacity="0.4">
    <ellipse cx="80" cy="55" rx="50" ry="18" fill="white"/>
    <ellipse cx="110" cy="50" rx="40" ry="15" fill="white"/>
