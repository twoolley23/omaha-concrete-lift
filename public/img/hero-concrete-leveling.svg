  <line x1="310" y1="240" x2="310" y2="330" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.7"/>
  <g transform="translate(115, 340)">
    <circle cx="0" cy="0" r="3" fill="#FFC107"/>
    <text x="0" y="16" text-anchor="middle" fill="#5D4037" font-size="7" font-family="sans-serif">1. Assess</text>
    <line x1="60" y1="0" x2="110" y2="0" stroke="#FFC107" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
    <circle cx="170" cy="0" r="3" fill="#FFC107"/>
    <text x="170" y="16" text-anchor="middle" fill="#5D4037" font-size="7" font-family="sans-serif">2. Inject</text>
    <line x1="230" y1="0" x2="280" y2="0" stroke="#FFC107" stroke-width="2" stroke-dasharray="4,3" opacity="0.5"/>
    <circle cx="340" cy="0" r="3" fill="#4CAF50"/>
    <text x="340" y="16" text-anchor="middle" fill="#2E7D32" font-size="7" font-family="sans-serif">3. Leveled</text>
