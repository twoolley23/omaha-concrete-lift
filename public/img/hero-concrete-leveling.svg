    <polygon points="-10,55 100,10 210,55" fill="#8B4513"/>
    <line x1="100" y1="10" x2="100" y2="55" stroke="#6B3410" stroke-width="2"/>
    <rect x="130" y="85" width="60" height="65" fill="#D4C4A0" rx="2"/>
